<h1>Times Table up to 100</h1>

<div class="tabs" role="tablist">
  <button id="t1" class="on" onclick="tab(1)">Table</button>

  <button id="t3" onclick="tab(3)">Sequences</button>
</div>

<section id="p1">
  <div class="card">

    <div class="grid" id="grid"></div>
  </div>
</section>

<section id="p2" hidden>
  <div class="card" id="setup">
    <b>What kind of problems?</b>
    <div class="chips" id="modes"></div>
    <b>Which times table?</b>
    <div class="chips" id="chips"></div>
    <button class="go" onclick="start()">Let's go</button>
  </div>
  <div class="card" id="quiz" hidden>
    <div class="row"><span id="qn"></span><span id="sc"></span></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="eq"><span id="qa"></span><span id="qop">×</span><span id="qb"></span><span>=</span>
      <input class="ans" id="ans" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Answer"></div>
    <button class="go" id="chk" onclick="check()">Check</button>
    <div class="msg" id="msg" aria-live="polite"></div>
    <div id="cardBox"></div>
    <button class="back" onclick="again()">Back to practice menu</button>
  </div>
  <div class="card" id="done" hidden>
    <div class="stars" id="stars"></div>
    <div class="big" id="final"></div>
    <div id="missBox" hidden><b>Worth reviewing:</b><ul class="miss" id="miss"></ul></div>
    <button class="go" onclick="again()">Another round</button>
  </div>
</section>

<section id="p3" hidden>
  <div class="card" id="sSetup">
    <b>Which sequence?</b>
    <div class="chips" id="sdir"></div>
    <b>What step size?</b>
    <div class="chips" id="schips"></div>
    <button class="go" onclick="sStart()">Let's go</button>
  </div>
  <div class="card" id="sQuiz" hidden>
    <div class="row"><span id="sqn"></span><span id="ssc"></span></div>
    <div class="bar"><i id="sbar"></i></div>
    <div>Fill in the missing number in the sequence</div>
    <div class="seq" id="seqRow"></div>
    <button class="go" id="sChk" onclick="sCheck()">Check</button>
    <div class="msg" id="sMsg" aria-live="polite"></div>
    <div id="sCard"></div>
    <button class="back" onclick="sBack()">Back to sequences menu</button>
  </div>
  <div class="card" id="sDone" hidden>
    <div class="stars" id="sStars"></div>
    <div class="big" id="sFinal"></div>
    <div id="sMissBox" hidden><b>Worth reviewing these sequences:</b><ul class="miss" id="sMiss"></ul></div>
    <button class="go" onclick="sBack()">Another round</button>
  </div>
</section>
</main>

  $('setup').hidden=true;$('done').hidden=true;$('quiz').hidden=false;show();
}
function show(){
  locked=false;var q=Q[qi];
  $('qa').textContent=q.a;$('qop').textContent=q.op;$('qb').textContent=q.b;
  $('qn').textContent='Question '+(qi+1)+' of '+Q.length;$('sc').textContent='Correct: '+score;

function check(){
  if(locked){qi++;if(qi>=Q.length)finish();else show();return}
  var q=Q[qi],v=$('ans').value.trim();

  else{miss.push(q.a+' '+q.op+' '+q.b+' = '+q.ans);$('msg').className='msg no';$('msg').textContent='Almost! The answer is '+q.ans}

$('ans').addEventListener('keydown',function(e){if(e.key==='Enter')check()});
function finish(){

  $('missBox').hidden=!miss.length;

function pickFact(pool,key){
  var seen=memSeen[key];
  if(!seen){try{seen=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){seen=[]}}
  var left=[];pool.forEach(function(_,i){if(seen.indexOf(i)<0)left.push(i)});
  if(!left.length){var last=seen[seen.length-1];seen=[];pool.forEach(function(_,i){if(i!==last)left.push(i)})}
  var i=left[Math.floor(Math.random()*left.length)];seen.push(i);memSeen[key]=seen;
  try{localStorage.setItem(key,JSON.stringify(seen))}catch(e){}
  return pool[i];
}
function r(k){return Math.floor(Math.random()*k)}
function chipRow(el,labels,onPick,multi){
  labels.forEach(function(l,i){
    var b=document.createElement('button');b.textContent=l[0];b.className=i==0?'on':'';b.setAttribute('aria-pressed',i==0);
    b.onclick=function(){onPick(l[1],b,el)};el.appendChild(b)});
}
var sDir='u',sSel=[],sQ=[],si=0,ss=0,sLock=false,sMissL=[];
var sdir=$('sdir'),schips=$('schips');
chipRow(sdir,[['Ascending','u'],['Descending','d'],['Both','b'],['Mixed','m']],function(v,b,el){
  sDir=v;[].forEach.call(el.children,function(x){x.className='';x.setAttribute('aria-pressed','false')});b.className='on';b.setAttribute('aria-pressed','true')});
chipRow(schips,[['Mix',0]].concat([2,3,4,5,6,7,8,9,10].map(function(n){return [n,n]})),function(v,b,el){
  if(v===0){sSel=[];[].forEach.call(el.children,function(x,j){x.className=j?'':'on';x.setAttribute('aria-pressed',j==0)});return}
  var k=sSel.indexOf(v);if(k<0)sSel.push(v);else sSel.splice(k,1);
  b.className=k<0?'on':'';b.setAttribute('aria-pressed',k<0);
  var none=!sSel.length;el.firstChild.className=none?'on':'';el.firstChild.setAttribute('aria-pressed',none)});
function mixSeq(d,n){
  var t=2+r(n-4),mx=Math.max(t,n-1-t),hill=r(2)==0,a=[],base=hill?1+mx*d+r(100-mx*d):1+r(100-mx*d);
  for(var i=0;i<n;i++)a.push(hill?base-Math.abs(i-t)*d:base+Math.abs(i-t)*d);
  return {a:a,m:1+r(n-2),d:d,mix:hill?'ud':'du'};
}
function genSeq(){
  var steps=sSel.length?sSel:[2,3,4,5,6,7,8,9,10],d=steps[r(steps.length)],n=5+r(3);
  if(sDir=='m')return mixSeq(d,n);
  var st=1+r(100-(n-1)*d),a=[];for(var i=0;i<n;i++)a.push(st+i*d);
  var desc=sDir=='d'||(sDir=='b'&&r(2)==0);if(desc)a.reverse();
  return {a:a,m:1+r(n-2),d:d,desc:desc};
}
function sStart(){
  sQ=[];for(var i=0;i<10;i++)sQ.push(genSeq());
  si=0;ss=0;sMissL=[];$('sSetup').hidden=true;$('sDone').hidden=true;$('sQuiz').hidden=false;sShow();
}
function sShow(){

    else d.textContent=v;
    row.appendChild(d)});
  $('sqn').textContent='Sequence '+(si+1)+' of '+sQ.length;$('ssc').textContent='Correct: '+ss;
  $('sbar').style.width=(si/sQ.length*100)+'%';
  $('sChk').textContent='Check';$('sMsg').textContent='';$('sMsg').className='msg';$('sCard').innerHTML='';$('sAns').focus();
}
function sCheck(){
  if(sLock){si++;if(si>=sQ.length)sFinish();else sShow();return}
  var q=sQ[si],v=$('sAns').value.trim(),ans=q.a[q.m],m=$('sMsg');
